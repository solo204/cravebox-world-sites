name: Rotate Featured Content

on:
  workflow_dispatch:          # manual trigger
  schedule:
    - cron: "5 * * * *"      # every hour at :05 past (matches SLOT_HOURS=1 in rotate.py)

jobs:
  rotate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run rotator
        run: python rotate.py

      - name: Commit featured.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rotate featured content [skip ci]"
          file_pattern: data/featured.json
